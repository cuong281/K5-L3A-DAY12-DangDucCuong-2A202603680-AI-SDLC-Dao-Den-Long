<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    /* All UI text >= 18px at 1280x720 (1rem = 18px); "Chữ lớn" scales the root by 1.25 */
    :root { --text: #F5F1E6; --gold: #F2C14E; --danger: #FF5A5F; --lit: #FFB347; --panel: rgba(14, 20, 48, .72); font-size: 18px; }
    :root.big { font-size: 22.5px; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0E1430; font-family: system-ui, "Segoe UI", sans-serif; color: var(--text); user-select: none; font-size: 1rem; }
    canvas { display: block; }
    .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000a; font-size: 1rem; }
    .small { font-size: 1rem; opacity: .9; }
    #flames { top: 14px; left: 16px; display: flex; gap: 8px; }
    .flame { width: 1.3rem; height: 1.75rem; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: radial-gradient(circle at 50% 70%, #FFE9B0, var(--lit) 60%, #c2621a); box-shadow: 0 0 12px var(--lit); }
    .flame.off { background: #5B5F6E; box-shadow: none; opacity: .5; }
    #timer { top: 10px; left: 50%; transform: translateX(-50%); font-size: 1.7rem; font-weight: 700; letter-spacing: 1px; background: var(--panel); padding: 2px 16px; border-radius: 10px; }
    #timer.danger { color: var(--danger); animation: blink .6s steps(2) infinite; }
    body.cb { --danger: #FFFFFF; }
    @keyframes blink { 50% { opacity: .35; } }
    #topright { top: 12px; right: 16px; text-align: right; background: var(--panel); padding: 6px 12px; border-radius: 10px; line-height: 1.5; }
    #topright b { color: var(--gold); }
    #motebar { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; background: var(--panel); padding: 7px 9px; border-radius: 10px; }
    .cell { width: 1rem; height: 1rem; border-radius: 50%; border: 1px solid #FFE58A55; }
    .cell.on { background: radial-gradient(circle, #FFF6C2, #FFE58A 70%); box-shadow: 0 0 8px #FFE58A; }
    .mlabel { margin-left: 6px; align-self: center; }
    #cds { bottom: 14px; right: 16px; display: flex; gap: 10px; }
    .cd { width: 4.2rem; height: 4.2rem; border-radius: 50%; display: grid; place-items: center; text-align: center; line-height: 1.1; border: 2px solid var(--gold); }
    #prompt { bottom: 4.5rem; left: 50%; transform: translateX(-50%); background: var(--panel); padding: 7px 16px; border-radius: 8px; display: none; }
    #prompt b { color: var(--gold); }
    #subs { bottom: 7.5rem; left: 50%; transform: translateX(-50%); text-align: center; }
    #subs div { background: rgba(0, 0, 0, .65); margin-top: 4px; padding: 4px 14px; border-radius: 6px; }
    #arrow, #shadearrow { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 30px solid var(--lit); filter: drop-shadow(0 0 6px var(--lit)); display: none; }
    #shadearrow { border-bottom-color: #7A3CFF; filter: drop-shadow(0 0 6px #7A3CFF); }
    body.cb #shadearrow { border-bottom-color: #00B3FF; filter: drop-shadow(0 0 6px #00B3FF); }
    #flash { position: fixed; inset: 0; background: #FF5A5F; opacity: 0; pointer-events: none; }
    body.cb #flash { background: #FFFFFF; }
    #status { top: 3.6rem; left: 16px; line-height: 1.6; }
    #status .charm { color: #ff8a9a; }
    #status .wind { color: #cfe3ff; }
    #fps { bottom: 4px; left: 6px; opacity: .7; }
    #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(14, 20, 48, .82); }
    #card { max-width: 40rem; max-height: 92vh; overflow: auto; padding: 24px 32px; background: rgba(27, 35, 80, .95); border: 1px solid #F2C14E66; border-radius: 14px; text-align: center; }
    #card h1 { margin: 0 0 6px; color: var(--lit); letter-spacing: 1px; font-size: 2rem; }
    #card h2 { margin: 0 0 10px; color: var(--gold); font-weight: 600; font-size: 1.3rem; }
    #card p { line-height: 1.55; }
    #card .quote { font-style: italic; color: #FFE9B0; }
    #card kbd { background: #0E1430; border: 1px solid #F2C14E66; border-radius: 4px; padding: 1px 6px; font-size: 1rem; margin: 0 1px; }
    #card button { display: block; width: 16rem; margin: 8px auto; padding: 10px; font-size: 1rem; color: var(--text); background: #0E1430; border: 1px solid var(--gold); border-radius: 8px; cursor: pointer; }
    #card button.kb { display: inline-block; width: 10rem; margin: 2px; padding: 4px; }
    #card button:hover, #card button:focus { background: #2a3570; outline: 2px solid var(--gold); }
    #card label { display: block; margin: 12px 0 4px; }
    #card input[type=range] { width: 16rem; }
    #card input[type=checkbox] { width: 1.1rem; height: 1.1rem; vertical-align: middle; }
    #card input[type=text] { font-size: 1.1rem; padding: 8px; width: 15rem; border-radius: 6px; border: 1px solid var(--gold); background: #0E1430; color: var(--text); }
    #card .err { color: var(--danger); min-height: 1rem; }
    table.board { margin: 8px auto; border-collapse: collapse; }
    table.board td, table.board th { padding: 4px 10px; border-bottom: 1px solid #ffffff22; }
    table.board tr.me { color: var(--gold); font-weight: 700; }
  </style>
</head>
<body>
  <div id="flash"></div>
  <div id="flames" class="hud"></div>
  <div id="status" class="hud"></div>
  <div id="timer" class="hud"></div>
  <div id="topright" class="hud"></div>
  <div id="subs" class="hud" aria-live="polite"></div>
  <div id="motebar" class="hud"></div>
  <div id="cds" class="hud"><div class="cd" id="cd-dash"></div><div class="cd" id="cd-pulse"></div></div>
  <div id="prompt" class="hud"></div>
  <div id="arrow" class="hud"></div>
  <div id="shadearrow" class="hud"></div>
  <div id="fps" class="hud"></div>
  <div id="overlay"><div id="card"></div></div>
  <script type="module" src="/src/web/main.js"></script>
</body>
</html>
